<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">CodeJudge architecture</title>
  <desc id="d">The browser loads the web app, which proxies the API. The API stores everything in Postgres, test packages in object storage, and puts judge jobs on a Redis Stream. Judge workers take jobs from Redis, fetch test packages and post results through the API's internal endpoint, and run each submission in an nsjail sandbox. A background worker runs plagiarism checks and other periodic tasks. Mail goes out through SMTP or SES; optional AI hints go to an OpenAI compatible endpoint.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d9488"/></marker>
  </defs>
  <rect width="1200" height="600" rx="16" fill="#f8fafc"/>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">
    <!-- browser -->
    <rect x="40" y="250" width="170" height="100" rx="12" fill="#e2e8f0"/>
    <text x="125" y="292" text-anchor="middle" font-weight="650">Browser</text>
    <text x="125" y="316" text-anchor="middle" fill="#475569" font-size="13">editor, scoreboards,</text>
    <text x="125" y="334" text-anchor="middle" fill="#475569" font-size="13">candidate page</text>
    <!-- web -->
    <rect x="270" y="250" width="170" height="100" rx="12" fill="#ccfbf1"/>
    <text x="355" y="292" text-anchor="middle" font-weight="650">web</text>
    <text x="355" y="316" text-anchor="middle" fill="#475569" font-size="13">Next.js 15</text>
    <text x="355" y="334" text-anchor="middle" fill="#475569" font-size="13">proxies /api</text>
    <!-- api -->
    <rect x="500" y="230" width="200" height="140" rx="12" fill="#99f6e4"/>
    <text x="600" y="276" text-anchor="middle" font-weight="650">api</text>
    <text x="600" y="300" text-anchor="middle" fill="#134e4a" font-size="13">FastAPI: problems,</text>
    <text x="600" y="318" text-anchor="middle" fill="#134e4a" font-size="13">submissions, contests,</text>
    <text x="600" y="336" text-anchor="middle" fill="#134e4a" font-size="13">classes, assessments</text>
    <text x="600" y="356" text-anchor="middle" fill="#134e4a" font-size="12">/internal/judge (token)</text>
    <!-- stores -->
    <rect x="780" y="60" width="170" height="70" rx="12" fill="#e0e7ff"/>
    <text x="865" y="92" text-anchor="middle" font-weight="650">Postgres</text>
    <text x="865" y="114" text-anchor="middle" fill="#475569" font-size="13">every row</text>
    <rect x="990" y="60" width="170" height="70" rx="12" fill="#e0e7ff"/>
    <text x="1075" y="92" text-anchor="middle" font-weight="650">Object storage</text>
    <text x="1075" y="114" text-anchor="middle" fill="#475569" font-size="13">test packages by hash</text>
    <rect x="780" y="265" width="170" height="70" rx="12" fill="#fee2e2"/>
    <text x="865" y="296" text-anchor="middle" font-weight="650">Redis</text>
    <text x="865" y="318" text-anchor="middle" fill="#475569" font-size="13">judge:jobs stream</text>
    <!-- judges -->
    <rect x="990" y="230" width="170" height="140" rx="12" fill="#0f766e"/>
    <text x="1075" y="268" text-anchor="middle" font-weight="650" fill="#f0fdfa">judge workers</text>
    <text x="1075" y="292" text-anchor="middle" fill="#ccfbf1" font-size="13">unprivileged, N replicas</text>
    <rect x="1010" y="306" width="130" height="48" rx="8" fill="#134e4a"/>
    <text x="1075" y="327" text-anchor="middle" fill="#ccfbf1" font-size="13">nsjail per run</text>
    <text x="1075" y="344" text-anchor="middle" fill="#99f6e4" font-size="12">no network, no tests</text>
    <!-- side services -->
    <rect x="500" y="460" width="200" height="80" rx="12" fill="#e2e8f0"/>
    <text x="600" y="494" text-anchor="middle" font-weight="650">background worker</text>
    <text x="600" y="516" text-anchor="middle" fill="#475569" font-size="13">plagiarism, expiry, cleanup</text>
    <rect x="780" y="460" width="170" height="80" rx="12" fill="#f1f5f9"/>
    <text x="865" y="494" text-anchor="middle" font-weight="650">Mail</text>
    <text x="865" y="516" text-anchor="middle" fill="#475569" font-size="13">Mailpit or SES</text>
    <rect x="990" y="460" width="170" height="80" rx="12" fill="#f1f5f9"/>
    <text x="1075" y="494" text-anchor="middle" font-weight="650">AI (optional)</text>
    <text x="1075" y="516" text-anchor="middle" fill="#475569" font-size="13">OpenAI compatible</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M210 300H262" marker-end="url(#a)"/>
    <path d="M440 300H492" marker-end="url(#a)"/>
    <path d="M700 260L776 110" marker-end="url(#a)"/>
    <path d="M700 250C820 180 940 140 986 120" marker-end="url(#a)"/>
    <path d="M700 300H776" marker-end="url(#a)"/>
    <path d="M600 370V452" marker-end="url(#a)"/>
    <path d="M700 380L776 470" marker-end="url(#a)"/>
    <path d="M700 360C850 420 940 450 986 480" marker-end="url(#a)"/>
  </g>
  <g stroke="#0d9488" stroke-width="2.5" fill="none">
    <path d="M950 300H982" marker-end="url(#j)"/>
    <path d="M990 360C900 400 780 390 708 352" marker-end="url(#j)"/>
  </g>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e">
    <text x="905" y="392" text-anchor="middle">packages and results via /internal/judge</text>
  </g>
</svg>
