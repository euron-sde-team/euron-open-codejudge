components:
  schemas:
    Ack:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        message:
          type: string
          title: Message
          default: ''
      type: object
      title: Ack
    AdminSettings:
      properties:
        site_name:
          type: string
          title: Site Name
        allow_signup:
          type: boolean
          title: Allow Signup
        default_language:
          type: string
          title: Default Language
        ai_enabled:
          type: boolean
          title: Ai Enabled
        ai_base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Ai Base Url
        ai_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Ai Model
        ai_has_key:
          type: boolean
          title: Ai Has Key
        ai_max_hints_per_problem:
          type: integer
          title: Ai Max Hints Per Problem
        ai_allowed_in_practice:
          type: boolean
          title: Ai Allowed In Practice
        ai_allowed_in_assignments:
          type: boolean
          title: Ai Allowed In Assignments
        ai_allowed_in_contests:
          type: boolean
          title: Ai Allowed In Contests
          default: false
        ai_allowed_in_assessments:
          type: boolean
          title: Ai Allowed In Assessments
          default: false
      type: object
      required:
      - site_name
      - allow_signup
      - default_language
      - ai_enabled
      - ai_base_url
      - ai_model
      - ai_has_key
      - ai_max_hints_per_problem
      - ai_allowed_in_practice
      - ai_allowed_in_assignments
      title: AdminSettings
    Announcement:
      properties:
        answer:
          type: string
          maxLength: 4000
          minLength: 1
          title: Answer
        public:
          type: boolean
          title: Public
          default: false
      type: object
      required:
      - answer
      title: Announcement
      description: 'Staff: an answer to a question, or (without a question id) a public announcement.'
    AssessmentCreate:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        instructions_md:
          type: string
          maxLength: 50000
          title: Instructions Md
          default: ''
        duration_minutes:
          type: integer
          maximum: 1440.0
          minimum: 1.0
          title: Duration Minutes
          default: 60
        opens_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Opens At
        closes_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Closes At
        problems:
          items:
            $ref: '#/components/schemas/AssessmentProblemIn'
          type: array
          maxItems: 20
          minItems: 1
          title: Problems
      type: object
      required:
      - title
      - problems
      title: AssessmentCreate
    AssessmentOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
        instructions_md:
          type: string
          title: Instructions Md
        duration_minutes:
          type: integer
          title: Duration Minutes
        opens_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Opens At
        closes_at:
          anyOf:
          - type: string
