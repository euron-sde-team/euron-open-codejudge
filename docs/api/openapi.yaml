openapi: 3.1.0
info:
  title: Euron Open CodeJudge
  description: "\nAPI of a self-hosted coding assessment platform: problems with hidden tests, submissions\n\
    judged in an unprivileged sandbox, contests with ICPC and IOI scoreboards, classes with\nassignments,\
    \ interview assessments, plagiarism checks and optional AI hints.\n\n* Sign in with `POST /api/v1/auth/login`;\
    \ send the session token as\n  `Authorization: Bearer <token>` (the dashboard uses an HttpOnly cookie\
    \ instead).\n* `POST /api/v1/submissions` queues a submission; `GET /api/v1/submissions/{id}/events`\n\
    \  streams its progress and verdict (server-sent events).\n* Interview candidates use the token from\
    \ their invitation link in the\n  `X-CodeJudge-Candidate` header instead of a session.\n\nJudge workers\
    \ are a separate service that reaches only `/internal/judge/*`.\n"
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in to the dashboard
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Sign out
      description: 'Ends this session server-side too: the token is refused until it expires.'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
  /api/v1/auth/me:
