[project]
name = "codejudge"
version = "0.1.0"
description = "Euron Open CodeJudge: a self-hosted coding assessment platform that judges submissions in an unprivileged sandbox and returns trustworthy verdicts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
# One package for the API, the background worker and the judge worker; each image installs
# it whole, and the judge worker gets no database or storage credentials at run time.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "orjson>=3.10",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pyjwt>=2.10",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "cryptography>=43",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "pyyaml>=6.0",
  "python-multipart>=0.0.20",
]

[project.scripts]
codejudge = "codejudge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "boto3-stubs[s3,kms,secretsmanager]>=1.35",
  "asgi-lifespan>=2.1",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codejudge", "src/mockai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Fixture programs the judge runs: some are broken or hostile on purpose.
extend-exclude = ["tests/judge/programs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101", "B008", "RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501", "PT018", "PT022", "PT011", "S110"]
"src/codejudge/migrations/**" = ["E501", "UP", "I"]
"src/mockai/**" = ["E501", "S311"]
"src/codejudge/demo/**" = ["E501", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs Postgres, Redis, Floci and the mock AI (make test-integration)",
  "judge: needs the judge image (nsjail and the toolchains; make test-judge)",
  "stack: needs the running stack with real judge workers (make up, then make test-stack)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["codejudge"]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["*/migrations/*", "*/demo/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true
