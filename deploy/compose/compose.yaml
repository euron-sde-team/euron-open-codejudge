# ─────────────────────────────────────────────────────────────────────────────
# Euron Open CodeJudge: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 4710   api 4730   mailpit 4725   mock AI 4750
#   postgres 4742   redis 4779   floci 4766
# ─────────────────────────────────────────────────────────────────────────────
name: codejudge

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  CODEJUDGE_CLOUD: local
  LOG_LEVEL: ${CJ_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://codejudge:codejudge@postgres:5432/codejudge
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  INVITE_TOKEN_PEPPER: ${INVITE_TOKEN_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  JUDGE_TOKEN: ${JUDGE_TOKEN:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/objects
  COOKIE_SECURE: "false"
  # The dashboard container proxies /api with X-Forwarded-For; trust it on the Compose
  # network. On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${CJ_WEB_PORT:-4710},http://127.0.0.1:${CJ_WEB_PORT:-4710}
  PUBLIC_URL: http://localhost:${CJ_WEB_PORT:-4710}
  # Invitation emails land in Mailpit (http://localhost:4725).
  MAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  CJ_DEMO_PASSWORD: ${CJ_DEMO_PASSWORD:?run `make env` first}
  # The demo seed points the optional AI hints at the mock LLM.
  CJ_DEMO_AI_URL: http://mock-ai:4750/v1

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: codejudge
      POSTGRES_USER: codejudge
      POSTGRES_PASSWORD: codejudge
    ports:
      - "127.0.0.1:${CJ_PG_PORT:-4742}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codejudge -d codejudge"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The judge job stream, live verdict events, scoreboard caches and rate limits.
  # noeviction: queued jobs must never be evicted to make room for a cache entry.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${CJ_REDIS_PORT:-4779}:6379"
    volumes:
      - redisdata:/data
    networks: [default, judge]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Catches invitation emails locally (SMTP 1025, web UI on 4725).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${CJ_MAILPIT_PORT:-4725}:8025"
    restart: unless-stopped

  # An OpenAI-compatible stand-in for the optional AI hints (no key, no network).
  mock-ai:
    build:
      <<: *server-build
      target: api
    image: codejudge-api:local
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockai.app:app", "--host", "0.0.0.0", "--port", "4750"]
    ports:
      - "127.0.0.1:${CJ_MOCK_AI_PORT:-4750}:4750"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4750/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: codejudge-api:local
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mock-ai:
        condition: service_started
    restart: "no"

  api:
    image: codejudge-api:local
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${CJ_API_PORT:-4730}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
    networks: [default, judge]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Background jobs: contest timers, analytics rollups, plagiarism runs, cleanup.
  worker:
    image: codejudge-api:local
    command: ["worker"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Judge workers: one sandbox at a time each, scale with CJ_JUDGES. Unprivileged: every
  # capability dropped, no new privileges, Docker's default seccomp plus only the
  # namespace syscalls nsjail needs (docs/architecture/sandbox.md). On the `judge`
  # network they reach the API and Redis only: no Postgres, no object storage, no web.
  judge:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/judge.Dockerfile
      target: judge
      args:
        APT_MIRROR: ${CJ_APT_MIRROR:-}
    image: codejudge-judge:local
    environment:
      LOG_LEVEL: ${CJ_LOG_LEVEL:-INFO}
      API_INTERNAL_URL: http://api:8080
      REDIS_URL: redis://redis:6379/0
      JUDGE_TOKEN: ${JUDGE_TOKEN:?run `make env` first}
      WORK_DIR: /tmp/judge
      CACHE_DIR: /var/cache/codejudge
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../../infra/docker/judge-seccomp.json
    read_only: true
    tmpfs:
      # Compiled programs run from here, so it needs exec; it is private to the worker.
      - /tmp:exec,size=1g,uid=10001,gid=10001,mode=0700
      - /var/cache/codejudge:size=2g,uid=10001,gid=10001,mode=0700
    pids_limit: 512
    mem_limit: 3g
    cpus: 2
    deploy:
      replicas: ${CJ_JUDGES:-2}
    networks: [judge]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: codejudge-web:local
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:${CJ_WEB_PORT:-4710}:3000"
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
  # Only the API, Redis and the judges: a compromised worker sees nothing else.
  judge:
    internal: true

volumes:
  pgdata:
  redisdata:
  objects:
